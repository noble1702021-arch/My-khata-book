<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ਖਾਤਾ ਬੁੱਕ & ਫੈਕਟਰੀ ਮੈਨੇਜਰ</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <link href="https://fonts.googleapis.com/css2?family=Mukta+Mahee:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --purple: #7c3aed;
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Mukta Mahee', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, var(--primary), #0f172a);
      color: #ffffff;
      padding: 16px;
      position: relative;
      text-align: center;
    }

    .header-content {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .header-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
      background: white;
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 800;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.15);
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
    }

    .menu-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 1.3rem;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    #deliveryReminderBanner {
      display: none;
      background: #fff1f2;
      border-left: 6px solid var(--danger);
      padding: 14px 18px;
      margin: 14px auto;
      max-width: 960px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      animation: pulseAlert 2s infinite ease-in-out;
    }

    @keyframes pulseAlert {
      0%, 100% { border-left-color: var(--danger); }
      50% { border-left-color: var(--warning); }
    }

    #deliveryReminderBanner h4 {
      color: #9f1239;
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #deliveryReminderBanner ul {
      margin-top: 8px;
      padding-left: 20px;
      font-size: 0.88rem;
      color: #881337;
      line-height: 1.5;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-btn {
      padding: 12px 2px;
      border: none;
      background: none;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: #eff6ff;
    }

    .container {
      max-width: 960px;
      margin: 16px auto;
      padding: 0 14px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
    }

    .card-sale-theme {
      background: #fbfdfb;
      border: 1px solid #bbf7d0;
      border-left: 8px solid #16a34a;
      border-right: 8px solid #16a34a;
      box-shadow: 0 4px 10px -2px rgba(22, 163, 74, 0.12);
    }
    .card-sale-theme .card-title {
      color: #166534;
      border-bottom-color: #dcfce7;
    }

    .card-purchase-theme {
      background: #fffcfc;
      border: 1px solid #fecaca;
      border-left: 8px solid #dc2626;
      border-right: 8px solid #dc2626;
      box-shadow: 0 4px 10px -2px rgba(220, 38, 38, 0.12);
    }
    .card-purchase-theme .card-title {
      color: #991b1b;
      border-bottom-color: #fee2e2;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--primary);
      border-bottom: 2px solid #eff6ff;
      padding-bottom: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .horizontal-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      align-items: flex-end;
    }

    .horizontal-row .form-group {
      flex: 0 0 190px;
      min-width: 170px;
    }

    .items-box {
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: 10px;
      padding: 14px;
      margin: 14px 0;
    }

    .item-entry-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 10px;
      overflow-x: auto;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .item-entry-row:last-child {
      border-bottom: none;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .form-group input, .form-group select {
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      width: 100%;
    }

    .form-group input:focus, .form-group select:focus { border-color: var(--primary-light); }
    .form-group input[readonly] { background: #f8fafc; font-weight: bold; color: var(--primary); }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 6px;
    }
    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-purple { background: var(--purple); color: white; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-edit { background: #0284c7; color: white; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-whatsapp { background: #25d366; color: white; }
    .btn-sm { padding: 5px 8px; font-size: 0.78rem; border-radius: 6px; }

    .slide-toggle-btn {
      width: 100%;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 700;
